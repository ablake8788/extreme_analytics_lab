[data]
upload_folder = uploads
max_upload_mb = 25

[defaults]
; Extreme channel
k_e = 2.0
k_p = 1.0
n_p = 3
n_m = 7
k_m = 1.2
n_exit = 1
window = 20
ewma_alpha = 0.3
percentile_p = 0.01
k_iqr = 1.5

; Change / Rate-of-Change channel
roc_window = 1
roc_baseline_window = 20
roc_k = 2.0
frequency_window = 10
frequency_min_count = 2

; Materiality score weights (should sum to 1.0)
w_magnitude = 0.4
w_duration = 0.4
w_frequency = 0.2

[app]
; mode: local = no login (this PC and the .exe), server = login required (web)
mode = local
host = 127.0.0.1
port = 5100
debug = false

[OpenAI]
# Optional: You can put the key here, or omit it and use an env var
# Model to use (default if not in env or in INI)
model = gpt-4o-mini
timeout_seconds = 90

[reports]
; reference document the AI follows (Titanium method and report format)
reference_document = info_main/reference/Titanium_analytics.docx
; folder where a copy of each Word report is saved (local mode only)
output_folder = results

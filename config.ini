[data]
upload_folder = uploads
max_upload_mb = 25

[defaults]
; Extreme channel
k_e = 2.0
k_p = 1.0
n_p = 3
n_m = 7
k_m = 1.2
n_exit = 1
window = 20
ewma_alpha = 0.3
percentile_p = 0.01
k_iqr = 1.5

; Change / Rate-of-Change channel
roc_window = 1
roc_baseline_window = 20
roc_k = 2.0
frequency_window = 10
frequency_min_count = 2
; remove a reading that comes more than this many minutes after the previous one:
; it is not in any calculation, the results or the reports. 0 = off
max_gap_minutes = 30

; Materiality score weights (should sum to 1.0)
w_magnitude = 0.4
w_duration = 0.4
w_frequency = 0.2

[app]
; mode: local = no login (this PC and the .exe), server = login required (web)
mode = local
host = 127.0.0.1
port = 5100
debug = false

[OpenAI]
# Optional: You can put the key here, or omit it and use an env var
# Model to use (default if not in env or in INI)
model = gpt-4o-mini
timeout_seconds = 90

[reports]
; reference document the AI follows (Titanium method and report format)
reference_document = info_main/reference/Titanium_analytics.docx
; folder where a copy of each Word report is saved (local mode only)
output_folder = results
;output_folder = C:\Users\ablak\MorrisAutoGroup Dropbox\Alexander Blake\MorrisUniversalAutoGroup\ara\ara\Ange\projects\ara\Titanium Intelligent Solution\Titanium Analytics\working\results





; Live system (step 1): metadata from ScyllaDB, readings from InfluxDB.
; Names only - hosts, users, tokens and passwords go in config.local.ini.
[source]
max_days = 731
max_rows = 500000
chunk_days = 31

[influx]
bucket = building_data
measurement = sensor_reading
field = value
day_night_tag = day_night

[scylla]
port = 9042
keyspace = titanium_meta
sites_table = sites
points_table = points

; Report history database (SQL Server). Schema: database\tables\titanium_analytics_history.sql
; Names only - server, user and password go in config.local.ini.
; Check with: .venv\Scripts\python.exe tools\check_sqlserver.py
[history]
enabled = false
database = PBI_Projects
; windows = your Windows login (Trusted_Connection); sql = username + password
auth = windows
; empty = newest installed "ODBC Driver 18/17 for SQL Server"
driver =
encrypt = true
trust_server_certificate = true
timeout_seconds = 15
; false = save only when you click "Save to history" (after Analyze / next to a report)
; true  = save every analysis and report automatically
auto_save = false
; save results in the background (the page does not wait for SQL Server)
background = true
; site for uploaded files whose sensor is not in ta.Sensor yet
default_site = Uploaded files
